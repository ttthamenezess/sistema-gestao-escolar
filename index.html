<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Interno - Cofflair</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primaria: #3d1a0a;
            --sucesso: #528f6c;
            --perigo: #e74c3c;
            --fundo: #f0f2f5;
            --menu-lateral: #3d1a0a; 
            --texto-menu: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: var(--fundo); 
            margin: 0; display: flex; height: 100vh;
            overflow: hidden;
        }

        /* --- TELA DE LOGIN --- */
        .tela-login {
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background-color: var(--primaria);
        }
        .caixa-login {
            background: white; padding: 40px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%; max-width: 350px; text-align: center;
        }
        .caixa-login img { width: 150px; margin-bottom: 20px; }
        .caixa-login h2 { color: var(--primaria); margin-bottom: 20px; }
        
        /* --- SISTEMA --- */
        #app-container { display: none; width: 100%; height: 100%; }

        .sidebar {
            width: 200px; background-color: var(--menu-lateral); color: var(--texto-menu);
            display: flex; flex-direction: column; padding: 0;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        .logo-area {
            background: white; margin: 20px; padding: 15px; text-align: center;
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .logo-area img { width: 100%; height: auto; object-fit: contain; }

        .nav-links { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }

        .menu-btn {
            padding: 15px 20px; cursor: pointer; border: none; background: none;
            color: var(--texto-menu); text-align: left; font-size: 1.1em; width: 100%; transition: 0.3s;
        }
        .menu-btn:hover, .menu-btn.active {
            background-color: rgba(255,255,255,0.1); border-left: 5px solid var(--sucesso);
        }
        
        .btn-sair {
            margin-top: auto; padding: 15px 20px; background: #c0392b; color: white;
            border: none; cursor: pointer; font-weight: bold; width: 100%; text-align: left;
        }

        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .page { display: none; }
        .page.active { display: block; }
        h1 { color: #2c3e50; margin-bottom: 30px; text-align: center; }

        .painel {
            background: white; padding: 25px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px;
        }

        .form-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px;
        }

        .input-group { display: flex; flex-direction: column; text-align: left; margin-bottom: 15px; }
        label { margin-bottom: 5px; font-weight: 600; color: #666; font-size: 0.85em; }
        input, select { 
            padding: 10px; border: 1px solid #ddd; border-radius: 6px; outline-color: var(--primaria);
        }

        .btn-acao { 
            padding: 12px; background: var(--primaria); color: white; width: 100%;
            border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }

        .btn-excel { background-color:#528f6c; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; justify-content: center; width: 250px; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #7f8c8d; text-transform: uppercase; font-size: 0.8em; }

        .status-pago { background: #d4efdf; color: #528f6c; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
        .status-aberto { background: #fadbd8; color: #943126; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }

        .lista-alunos { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .cartela { background: white; padding: 20px; border-radius: 12px; border-left: 8px solid var(--primaria); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .info-linha { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9em; }
        .info-label { font-weight: bold; color: #888; }
        .btn-excluir { width: 100%; margin-top: 15px; padding: 8px; background: none; border: 1px solid var(--perigo); color: var(--perigo); border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-container" class="tela-login">
        <div class="caixa-login">
            <img src="TEA_PRIMÁRIO.jpg" alt="Logo Cofflair" onerror="this.style.display='none'">
            <h2>Acesso Restrito</h2>
            <form id="formLogin">
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn-acao">Entrar</button>
            </form>
        </div>
    </div>

    <div id="app-container">
        <div class="sidebar">
            <div class="logo-area">
                <img src="TEA_PRIMÁRIO.jpg" alt="Logo Cofflair">
            </div>
            <div class="nav-links">
                <button class="menu-btn active" id="btn-mat" onclick="switchPage('matricula')">Matrículas</button>
                <button class="menu-btn" id="btn-fin" onclick="switchPage('financeiro')">Financeiro</button>
            </div>
            <button class="btn-sair" onclick="fazerLogout()">🚪 Sair</button>
        </div>

        <div class="main-content">
            <div id="page-matricula" class="page active">
                <h1>🎓 Gestão de Matrículas</h1>
                <div class="painel">
                    <form id="alunoForm">
                        <div class="form-grid">
                            <div class="input-group"><label>Nome</label><input type="text" id="nome" required></div>
                            <div class="input-group"><label>CPF</label><input type="text" id="cpf" required></div>
                            <div class="input-group"><label>E-mail</label><input type="email" id="email" required></div>
                            <div class="input-group"><label>Endereço</label><input type="text" id="endereco" required></div>
                            <div class="input-group"><label>Turma</label><input type="text" id="turma" required></div>
                            <div class="input-group"><label>Valor Mensalidade (R$)</label><input type="number" step="0.01" id="valor" required></div>
                            <button type="submit" class="btn-acao" style="grid-column: 1/-1;">Adicionar Aluno</button>
                        </div>
                    </form>
                </div>
                <button class="btn-acao btn-excel" onclick="exportarExcel()">📊 Baixar Relatório Alunos</button>
                <div id="listaAlunos" class="lista-alunos"></div>
            </div>

            <div id="page-financeiro" class="page">
                <h1>💰 Controle Financeiro</h1>
                <div class="painel">
                    <div class="form-grid" style="grid-template-columns: 1fr 1fr 200px;">
                        <div class="input-group">
                            <label>Mês de Referência</label>
                            <select id="filtroMes">
                                <option value="01">Janeiro</option>
                                <option value="02">Fevereiro</option>
                                <option value="03">Março</option>
                                <option value="04">Abril</option>
                                <option value="05">Maio</option>
                                <option value="06">Junho</option>
                                <option value="07">Julho</option>
                                <option value="08">Agosto</option>
                                <option value="09">Setembro</option>
                                <option value="10">Outubro</option>
                                <option value="11">Novembro</option>
                                <option value="12">Dezembro</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Ano</label>
                            <input type="number" id="filtroAno" value="2026">
                        </div>
                        <button class="btn-acao" onclick="atualizarFinanceiro()" style="align-self: flex-end;">Filtrar</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Aluno</th>
                                <th>Valor</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="corpoFinanceiro"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. INICIALIZAÇÃO DO SUPABASE
        // ==========================================
        const supabaseUrl = 'https://trmdidrtlmtremekwrbv.supabase.co';
        const supabaseKey = 'sb_publishable_m5lg0ndNCEgJ_PVShBU9Cw_V34ZttAl';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let bancoDadosAlunos = [];

        // ==========================================
        // 2. SISTEMA DE LOGIN (AUTENTICAÇÃO)
        // ==========================================
        
        // Função para verificar se a pessoa já fez login antes
        async function verificarSessao() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                // Se tem sessão, esconde login, mostra app e busca os alunos
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                buscarAlunos();
            }
        }

        // Função do botão de entrar
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            // Tenta fazer o login no Supabase
            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert("Erro ao entrar: E-mail ou senha incorretos.");
            } else {
                // Login deu certo
                document.getElementById('login-email').value = '';
                document.getElementById('login-password').value = '';
                verificarSessao(); 
            }
        });

        // Função de sair (Logout)
        window.fazerLogout = async function() {
            await _supabase.auth.signOut();
            // Recarrega a página para voltar pra tela de login limpa
            window.location.reload();
        };

        // ==========================================
        // 3. NAVEGAÇÃO
        // ==========================================
        window.switchPage = function(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById('page-' + pageId).classList.add('active');
            if(pageId === 'matricula') {
                document.getElementById('btn-mat').classList.add('active');
                buscarAlunos();
            } else {
                document.getElementById('btn-fin').classList.add('active');
                window.atualizarFinanceiro();
            }
        };

        // ==========================================
        // 4. OPERAÇÕES DE ALUNOS (MATRÍCULA)
        // ==========================================
        document.getElementById('alunoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const novoAluno = {
                nome: document.getElementById('nome').value,
                cpf: document.getElementById('cpf').value,
                email: document.getElementById('email').value,
                endereco: document.getElementById('endereco').value,
                valor: parseFloat(document.getElementById('valor').value),
                turma: document.getElementById('turma').value
            };

            const { data, error } = await _supabase
                .from('alunos')
                .insert([novoAluno]);

            if (error) {
                alert("Erro ao salvar aluno: " + error.message);
            } else {
                alert("Aluno cadastrado com sucesso!");
                e.target.reset();
                buscarAlunos();
            }
        });

        async function buscarAlunos() {
            const { data, error } = await _supabase
                .from('alunos')
                .select('*')
                .order('nome', { ascending: true });

            if (error) {
                console.error("Erro ao buscar alunos:", error.message);
            } else {
                bancoDadosAlunos = data;
                renderizarAlunos();
            }
        }

        function renderizarAlunos() {
            const container = document.getElementById('listaAlunos');
            container.innerHTML = '';
            bancoDadosAlunos.forEach(aluno => {
                container.innerHTML += `
                    <div class="cartela">
                        <h3>${aluno.nome}</h3>
                        <div class="info-linha"><span class="info-label">CPF:</span><span>${aluno.cpf}</span></div>
                        <div class="info-linha"><span class="info-label">Turma:</span><span>${aluno.turma}</span></div>
                        <div class="info-linha"><span class="info-label">Valor:</span><span>R$ ${parseFloat(aluno.valor).toFixed(2)}</span></div>
                        <button class="btn-excluir" onclick="removerAluno('${aluno.id}')">Excluir Aluno</button>
                    </div>
                `;
            });
        }

        window.removerAluno = async function(id) {
            if(confirm("Deseja realmente excluir este aluno?")) {
                const { error } = await _supabase
                    .from('alunos')
                    .delete()
                    .eq('id', id);

                if (error) alert("Erro ao excluir: " + error.message);
                else buscarAlunos();
            }
        };

        // ==========================================
        // 5. OPERAÇÕES FINANCEIRAS (PAGAMENTOS)
        // ==========================================
        window.atualizarFinanceiro = async function() {
            const mes = document.getElementById('filtroMes').value;
            const ano = document.getElementById('filtroAno').value;
            const corpo = document.getElementById('corpoFinanceiro');
            
            corpo.innerHTML = '<tr><td colspan="4">Carregando dados...</td></tr>';

            await buscarAlunos();
            
            const { data: pagamentos, error } = await _supabase
                .from('pagamentos')
                .select('*');

            corpo.innerHTML = '';
            
            bancoDadosAlunos.forEach(aluno => {
                const pgtoRealizado = pagamentos ? pagamentos.find(p => {
                    if(p.aluno_id != aluno.id) return false; 
                    if(!p.vencimento) return false;
                    
                    const dataPgto = new Date(p.vencimento);
                    const mesPgto = String(dataPgto.getUTCMonth() + 1).padStart(2, '0');
                    const anoPgto = String(dataPgto.getUTCFullYear());
                    
                    return mesPgto === mes && anoPgto === ano && p.status_pago === true;
                }) : null;

                corpo.innerHTML += `
                    <tr>
                        <td><strong>${aluno.nome}</strong></td>
                        <td>R$ ${parseFloat(aluno.valor).toFixed(2)}</td>
                        <td>
                            <span class="${pgtoRealizado ? 'status-pago' : 'status-aberto'}">
                                ${pgtoRealizado ? 'PAGO' : 'EM ABERTO'}
                            </span>
                        </td>
                        <td>
                            ${!pgtoRealizado ? 
                                `<button class="btn-acao" style="background:#2ecc71; padding:5px 12px;" onclick="registrarPagamento('${aluno.id}', ${aluno.valor}, '${ano}-${mes}-10')">Confirmar Pagamento</button>` 
                                : 
                                `<button class="btn-acao" style="background:#9b59b6; padding:5px 12px;" onclick="baixarNF('${aluno.nome}', '${mes}/${ano}', '${aluno.valor}', '${aluno.cpf}')">Gerar Recibo</button>`
                            }
                        </td>
                    </tr>
                `;
            });
        };

        window.registrarPagamento = async function(alunoId, valor, dataVencimento) {
            const { error } = await _supabase
                .from('pagamentos')
                .insert([{ 
                    aluno_id: alunoId, 
                    valor: valor, 
                    vencimento: dataVencimento, 
                    status_pago: true 
                }]);

            if (error) {
                alert("Erro ao registrar pagamento: " + error.message);
            } else {
                window.atualizarFinanceiro();
            }
        };

        window.baixarNF = function(nome, mesAno, valor, cpf) {
            const conteudo = `RECIBO COFFLAIR\n\nCLIENTE: ${nome}\nCPF: ${cpf}\nREFERENTE A: ${mesAno}\nVALOR: R$ ${parseFloat(valor).toFixed(2)}\nSTATUS: PAGO\nDATA DE EMISSÃO: ${new Date().toLocaleDateString('pt-BR')}`;
            const blob = new Blob([conteudo], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = `Recibo_${nome}_${mesAno.replace('/','-')}.txt`;
            link.click();
        };

        window.exportarExcel = function() {
            if (bancoDadosAlunos.length === 0) return alert("Não há dados para exportar.");
            let csvContent = "data:text/csv;charset=utf-8,Nome;CPF;Email;Turma;Valor\n";
            bancoDadosAlunos.forEach(a => {
                csvContent += `${a.nome};${a.cpf};${a.email};${a.turma};${a.valor}\n`;
            });
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", "Relatorio_Alunos_Cofflair.csv");
            link.click();
        };

        // Inicia rodando a verificação de login
        verificarSessao();
    </script>
</body>
</html>
